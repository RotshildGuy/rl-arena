<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#07080d" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon-180.png" />
    <meta name="apple-mobile-web-app-title" content="RL Arena" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!-- Fonts are self-hosted (see styles.css); nothing is fetched from a third
         party, so loading the page contacts this origin and nothing else. -->
    <link rel="preload" href="/fonts/heebo-hebrew.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/heebo-latin.woff2" as="font" type="font/woff2" crossorigin />
    <meta name="description" content="אליפות יומית של מודלים ללמידת חיזוק. אמנו מודל, רשמו אותו, וצפו בו מתחרה." />
    <meta name="robots" content="index, follow" />
    <!-- Link previews (WhatsApp, Telegram, social): a link sent to a friend
         shows a card instead of a bare address. The image is public/og.png,
         redrawn by scripts/og/render.cjs. Previews need absolute URLs. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="RL Arena" />
    <meta property="og:locale" content="he_IL" />
    <meta property="og:url" content="https://rl-arena.web.app/" />
    <meta property="og:title" content="RL Arena - המודלים נוהגים, אתם בונים אותם" />
    <meta property="og:description" content="אליפות יומית ב-20:00 של מודלים ללמידת חיזוק. מאמנים מודל בדפדפן, רושמים אותו, וצופים בו מתחרה בשידור חי." />
    <meta property="og:image" content="https://rl-arena.web.app/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <title>RL Arena - אליפות מודלים</title>
    <!-- Light or dark before the first paint, so a light-mode phone never sees
         the dark page flash while the bundle loads. Mirrors ui/theme.ts. -->
    <script>
      (function () {
        var pref = null;
        try { pref = localStorage.getItem('rl-arena-theme'); } catch (e) {}
        var dark = pref === 'dark' || (pref !== 'light' && !(window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches));
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <!-- The first frame: a skeleton of the app, drawn with the stylesheet
           before any script runs. React replaces it; keep it in step with
           Splash in ui/App.tsx. -->
      <div class="skel-app" aria-busy="true" aria-label="טוען">
        <div class="skel-top">
          <span class="brand"><span class="mark">RL</span> <span>ARENA</span></span>
          <span class="skel pill wide-only" style="width: 300px; height: 34px"></span>
          <span class="grow"></span>
          <span class="skel pill" style="width: 34px; height: 30px"></span>
          <span class="skel pill" style="width: 84px; height: 30px"></span>
        </div>
        <div class="skel-body">
          <span class="skel" style="width: 130px; height: 12px"></span>
          <span class="skel" style="width: min(420px, 80%); height: 30px"></span>
          <span class="skel" style="width: min(560px, 95%); height: 14px"></span>
          <div class="skel-cols">
            <div class="skel-card" style="min-height: 280px">
              <span class="skel" style="width: 40%; height: 12px"></span>
              <span class="skel" style="width: 70%; height: 34px"></span>
              <span class="skel" style="width: 55%; height: 52px"></span>
              <span class="skel" style="width: 100%; height: 64px"></span>
              <span class="skel pill" style="width: 160px; height: 38px"></span>
            </div>
            <div class="skel-card" style="min-height: 200px">
              <span class="skel" style="width: 35%; height: 12px"></span>
              <span class="skel" style="width: 100%; height: 40px"></span>
              <span class="skel" style="width: 100%; height: 40px"></span>
              <span class="skel" style="width: 100%; height: 40px"></span>
            </div>
          </div>
        </div>
        <div class="skel-nav"></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
