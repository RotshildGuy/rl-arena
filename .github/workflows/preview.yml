# Build every branch other than main and publish it to its own Firebase
# Hosting preview channel: a separate, temporary address for trying a change on
# a phone before it is merged. The live site is untouched - only deploy.yml
# publishes to it.
#
# A preview is the real app on the real project: signing in, the championship
# and the cloud library are the same ones the live site uses. Only the code is
# different.
name: Preview on Firebase Hosting

on:
  push:
    branches-ignore: [main]
  workflow_dispatch:

# One channel per branch, and a newer push replaces an older one in flight.
concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run sanity

      # Same rule as deploy.yml: a build without the keys runs local-only and
      # looks healthy, which would make a preview that tests the wrong app.
      - name: Check the Firebase config is present
        env:
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY || secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN || secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID || secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID || secrets.VITE_FIREBASE_APP_ID }}
        run: |
          missing=
          for name in VITE_FIREBASE_API_KEY VITE_FIREBASE_AUTH_DOMAIN VITE_FIREBASE_PROJECT_ID VITE_FIREBASE_APP_ID; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing Firebase config:$missing."
            exit 1
          fi

      - name: Build
        env:
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY || secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN || secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID || secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID || secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET || secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID || secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
        run: npm run build

      # A channel id is lowercase letters, digits and dashes, at most 36 long
      # once Firebase adds its own suffix, so the branch name is folded into one.
      - name: Name the channel
        id: channel
        run: |
          id=$(echo "${GITHUB_REF_NAME}" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g; s/^-+|-+$//g' | cut -c1-36)
          echo "id=${id%-}" >> "$GITHUB_OUTPUT"

      - uses: FirebaseExtended/action-hosting-deploy@v0
        id: deploy
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ vars.VITE_FIREBASE_PROJECT_ID || secrets.VITE_FIREBASE_PROJECT_ID || 'reinforcement-learning-ed0ed' }}
          channelId: ${{ steps.channel.outputs.id }}
          expires: 7d
          # Pinned: 15.34.1 (21.10.2026) first asks the Service Usage API whether
          # Hosting is enabled, which the deploy service account may not do, and
          # every deploy failed with a 403. Unpin once the account has the
          # "Service Usage Viewer" role.
          firebaseToolsVersion: 15.34.0

      - name: Preview address
        env:
          DETAILS_URL: ${{ steps.deploy.outputs.details_url }}
        run: |
          echo "Preview: $DETAILS_URL"
          echo "### Preview: $DETAILS_URL" >> "$GITHUB_STEP_SUMMARY"
